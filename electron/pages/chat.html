<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Twitch Chat Overlay</title>

  <!-- Custom style from frontend -->
</head>

<body>
  <!-- Custom html from frontend -->

  <script>
    const es = new EventSource('/events');
    const messagesContainer = document.getElementById('messages');
    const MAX_MESSAGES = 50;
    const BASE_EMOTE_HEIGHT_REM = 2;
    const MIN_EMOTE_WIDTH_REM = 1;
    const MAX_EMOTE_WIDTH_REM = 4;

    function applyEmoteAspectRatio(emoteImg) {
      const naturalWidth = emoteImg.naturalWidth;
      const naturalHeight = emoteImg.naturalHeight;

      if (!naturalWidth || !naturalHeight) {
        emoteImg.style.width = BASE_EMOTE_HEIGHT_REM + 'rem';
        emoteImg.style.height = BASE_EMOTE_HEIGHT_REM + 'rem';
        return;
      }

      const ratio = naturalWidth / naturalHeight;
      const widthRem = Math.min(
        MAX_EMOTE_WIDTH_REM,
        Math.max(MIN_EMOTE_WIDTH_REM, BASE_EMOTE_HEIGHT_REM * ratio)
      );

      emoteImg.style.width = widthRem + 'rem';
      emoteImg.style.height = BASE_EMOTE_HEIGHT_REM + 'rem';
      emoteImg.style.objectFit = 'contain';
    }

    es.onmessage = (ev) => {
      try {
        const data = JSON.parse(ev.data);
        console.log('Received chat data:', data);

        if (data.type === 'overlay-refresh') {
          window.location.reload();
          return;
        }

        if (data.type === "twitch-chat") {
          addMessage(data.username, data.message, data.color, data.fragments);
          if (onChatMessage) onChatMessage(data);
        }
      } catch (e) {
        console.error('Bad payload', e, ev.data);
      }
    };

    /**
     * Builds a message div from fragments array
     * @param {Array} fragments - Array of message fragments with type, text, and emoteUrl
     * @returns {HTMLElement} - A div containing the built message
     */
    function buildMessageFromFragments(fragments) {
      const messageDiv = document.createElement('div');
      messageDiv.className = 'message-content';
      messageDiv.style = "display: flex; flex-direction: row; justify-content: flex-start; align-content: center;"

      if (!fragments || !Array.isArray(fragments)) {
        messageDiv.textContent = '';
        return messageDiv;
      }

      fragments.forEach((fragment) => {
        if (fragment.type === 'emote' && fragment.emoteUrl) {
          // Create img tag for emote
          const emoteImg = document.createElement('img');
          emoteImg.src = fragment.emoteUrl;
          emoteImg.className = 'emote';
          emoteImg.style = `height: ${BASE_EMOTE_HEIGHT_REM}rem; width: ${BASE_EMOTE_HEIGHT_REM}rem; object-fit: contain;`
          emoteImg.onload = () => applyEmoteAspectRatio(emoteImg);
          if (emoteImg.complete) {
            applyEmoteAspectRatio(emoteImg);
          }
          emoteImg.alt = fragment.text || 'emote';
          emoteImg.title = fragment.text || 'emote';
          messageDiv.appendChild(emoteImg);
        } else if (fragment.type === 'text') {
          // Create text node
          const textSpan = document.createElement('span');
          textSpan.className = 'text';
          textSpan.textContent = fragment.text || '';
          messageDiv.appendChild(textSpan);
        } else if (fragment.type === 'mention') {
          // Create mention node
          const mentionSpan = document.createElement('span');
          mentionSpan.className = 'mention';
          mentionSpan.textContent = fragment.text || '';
          messageDiv.appendChild(mentionSpan);
        } else {
          // Fallback for unknown types
          const span = document.createElement('span');
          span.textContent = fragment.text || '';
          messageDiv.appendChild(span);
        }
      });

      return messageDiv;
    }

    function addMessage(username, message, color = '#FFFFFF', fragments = null) {
      const messageEl = document.createElement('div');
      messageEl.className = 'message';

      const usernameEl = document.createElement('span');
      usernameEl.className = 'username';
      usernameEl.textContent = username + ':';
      usernameEl.style.color = color;
      messageEl.appendChild(usernameEl);

      // Use fragments if available, otherwise fall back to plain text message
      if (fragments) {
        const contentEl = buildMessageFromFragments(fragments);
        contentEl.className = 'message-text';
        contentEl.style = "display: flex; flex-direction: row; justify-content: flex-start; align-content: center; width: fit-content; flex-wrap: wrap;"
        messageEl.appendChild(contentEl);
      } else {
        const textEl = document.createElement('span');
        textEl.className = 'message-text';
        textEl.textContent = message;
        messageEl.appendChild(textEl);
      }

      messagesContainer.appendChild(messageEl);

      // Scroll to bottom
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      // Remove old messages if we exceed max
      while (messagesContainer.children.length > MAX_MESSAGES) {
        messagesContainer.removeChild(messagesContainer.firstChild);
      }
    }

    es.onerror = (err) => {
      console.error('EventSource error:', err);
    };
  </script>

  <!-- Custom js from frontend -->
</body>

</html>
